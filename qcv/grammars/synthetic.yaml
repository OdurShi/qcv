# Synthetic demo grammar (not a benchmark of the paper). It mirrors the
# counting-difference example of the paper's pipeline figure and adds a small
# inverse-relation rule, so that the full pipeline can be exercised without a
# VLM or a dataset. Each rule mixes three kinds of auxiliaries: restatements of
# the target, an inverse question, and part/recomposition questions.
# The first rule has eight auxiliaries (budgets up to B = 9); the second has
# six, so it falls back to target-only decoding at B = 9.
task: synthetic
version: "1.0"
roles:
  difference:
    answer_type: numeric
    integer_range: {start: -4, stop: 4}
    numeric_precision: 0
  difference_restated:
    answer_type: numeric
    integer_range: {start: -4, stop: 4}
    numeric_precision: 0
  difference_recomputed:
    answer_type: numeric
    integer_range: {start: -4, stop: 4}
    numeric_precision: 0
  inverse_difference:
    answer_type: numeric
    integer_range: {start: -4, stop: 4}
    numeric_precision: 0
  first_count:
    answer_type: numeric
    integer_range: {start: 0, stop: 4}
    numeric_precision: 0
  second_count:
    answer_type: numeric
    integer_range: {start: 0, stop: 4}
    numeric_precision: 0
  total_count:
    answer_type: numeric
    integer_range: {start: 0, stop: 8}
    numeric_precision: 0
  comparison:
    answer_type: categorical
    values: [greater, less, equal]
  more_boolean:
    answer_type: boolean
    values: ["yes", "no"]
  spatial_relation:
    answer_type: relation
    values: [left, right, front, behind]
  spatial_relation_restated:
    answer_type: relation
    values: [left, right, front, behind]
  inverse_spatial_relation:
    answer_type: relation
    values: [left, right, front, behind]
  relation_boolean:
    answer_type: boolean
    values: ["yes", "no"]
rules:
  - name: count_difference
    pattern: "how many more (?P<a>.+?) than (?P<b>.+?) are there"
    target: {role: difference, variable: difference_ab}
    auxiliaries:
      - {index: 1, text: "How many {a} are there?", role: first_count, variable: count_a}
      - {index: 2, text: "How many {b} are there?", role: second_count, variable: count_b}
      - {index: 3, text: "By how many do the {a} outnumber the {b}?", role: difference_restated, variable: restated_ab}
      - {index: 4, text: "How many more {b} than {a} are there?", role: inverse_difference, variable: difference_ba}
      - {index: 5, text: "How many {a} and {b} are there in total?", role: total_count, variable: total_ab}
      - {index: 6, text: "What is the number of {a} minus the number of {b}?", role: difference_recomputed, variable: recomputed_ab}
      - {index: 7, text: "Is the number of {a} greater than, less than, or equal to the number of {b}?", role: comparison, variable: comparison_ab}
      - {index: 8, text: "Are there more {a} than {b}?", role: more_boolean, variable: more_a}
    constraints:
      - {kind: difference_eq, variables: [count_a, count_b, difference_ab]}
      - {kind: difference_eq, variables: [count_b, count_a, difference_ba]}
      - {kind: sum_eq, variables: [count_a, count_b, total_ab]}
      - {kind: equal, variables: [difference_ab, restated_ab]}
      - {kind: equal, variables: [difference_ab, recomputed_ab]}
      - {kind: comparison_from_values, variables: [count_a, count_b, comparison_ab]}
      - {kind: threshold_boolean, variables: [difference_ab, more_a], parameters: {operator: gt, threshold: 0}}
  - name: spatial_inverse
    pattern: "what is the spatial relation of (?P<a>.+?) relative to (?P<b>.+)"
    target: {role: spatial_relation, variable: relation_ab}
    auxiliaries:
      - {index: 1, text: "Is {a} left of {b}?", role: relation_boolean, variable: is_left}
      - {index: 2, text: "Is {a} right of {b}?", role: relation_boolean, variable: is_right}
      - {index: 3, text: "Where is {a} in relation to {b}?", role: spatial_relation_restated, variable: restated_ab}
      - {index: 4, text: "What is the spatial relation of {b} relative to {a}?", role: inverse_spatial_relation, variable: relation_ba}
      - {index: 5, text: "Is {a} in front of {b}?", role: relation_boolean, variable: is_front}
      - {index: 6, text: "Is {a} behind {b}?", role: relation_boolean, variable: is_behind}
    constraints:
      - {kind: equal, variables: [relation_ab, restated_ab]}
      - kind: inverse_relation
        variables: [relation_ab, relation_ba]
        parameters:
          inverse_map: {left: right, right: left, front: behind, behind: front}
      - kind: one_hot_relations
        variables: [relation_ab, is_left, is_right, is_front, is_behind]
        parameters: {labels: [left, right, front, behind]}
